<div class="ticker-selector bg-crypto-navy/90 backdrop-blur-sm rounded-xl shadow-2xl p-6 mb-6 border border-crypto-green/20">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-white flex items-center gap-2">
      Selector
    </h2>
    <div class="text-sm text-crypto-green-light">
      <span class="font-medium">Hora actual:</span>
      <span class="ml-1 font-mono text-crypto-gold">{{ currentTime }}</span>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
    <div *ngFor="let ticker of tickers" 
         [ngClass]="getCardClasses(ticker)"
         class="ticker-card p-4 border-2 rounded-xl cursor-pointer transition-all duration-300 hover:shadow-lg hover:scale-105 hover:bg-gradient-to-br active:scale-95 backdrop-blur-sm focus:outline-none focus:ring-4" 
         (click)="onTickerChange(ticker)">
      <div class="flex justify-between items-center">
        <span class="font-bold text-lg flex items-center gap-1"
              [ngClass]="getTickerClasses(ticker)">
          {{ ticker }}
        </span>
        <span class="text-sm font-bold animate-pulse" 
              [ngClass]="getPriceClasses(ticker)"
              *ngIf="getCurrentPrice(ticker) > 0">
          ${{ getCurrentPrice(ticker) | number:'1.2-2' }}
        </span>
      </div>
      <div class="mt-2 text-xs opacity-90"
           [ngClass]="getNameClasses(ticker)">
        {{ getTickerName(ticker) }}
      </div>
    </div>
  </div>
</div>
